<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedestrian Safety Guard</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="alertOverlay" class="alert-overlay hidden">
    <div class="alert-content">
      <div class="alert-icon">⚠️</div>
      <h1 class="alert-title">DANGER!</h1>
      <p class="alert-message">Vehicle approaching! Loud noise detected.</p>
    </div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🎧</span>
        <h1>City<span>Guard</span></h1>
      </div>
      <p class="subtitle">AI-Powered Environmental Audio Monitoring</p>
    </header>

    <main class="dashboard glass-panel">
      
      <div class="controls-section">
        <button id="toggleBtn" class="btn primary-btn pulse-glow">
          Start Protection
        </button>
      </div>
      
      <div class="status-section">
        <div id="statusIndicator" class="status-badge safe">
          <span class="pulse-dot"></span>
          <span id="statusText">System Idle</span>
        </div>
      </div>

      <div class="visualizer-section">
        <p class="section-title">Live Audio Feed</p>
        <div class="canvas-container">
          <canvas id="waveformCanvas"></canvas>
        </div>
        <div class="volume-meter">
          <div class="volume-bar-bg">
            <div id="volumeBar" class="volume-bar-fill"></div>
          </div>
          <span id="volumeValue">0%</span>
        </div>
      </div>
      
      <div class="detection-section">
        <p class="section-title">Detection Result</p>
        <div id="detectionBox" class="detection-box">
          <span id="detectionText" class="placeholder">Awaiting Audio...</span>
        </div>
      </div>

    </main>

    <aside class="settings glass-panel">
      <h3>System Configuration</h3>
      <div class="setting-item">
        <label for="sensitivitySlider">Sensitivity</label>
        <input type="range" id="sensitivitySlider" min="0" max="100" value="70">
        <span id="sensitivityValue" class="setting-val">70%</span>
      </div>
      <div class="setting-item">
        <label for="demoToggle" class="switch-label">
          <span>Demo Mode (Simulate Audio)</span>
          <div class="toggle-switch">
            <input type="checkbox" id="demoToggle">
            <span class="slider round"></span>
          </div>
        </label>
      </div>
    </aside>
  </div>

  <!-- Scripts -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
